# Local observability stack:
#   app  --OTLP/HTTP-->  otel-collector  --OTLP/gRPC-->  jaeger (traces)
#                                         --scrape-->    prometheus (metrics)
#                                         --debug-->     collector stdout (logs)
# Run:    docker compose up --build
# Jaeger: http://localhost:16686   Prometheus: http://localhost:9090
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      OTEL_SERVICE_NAME: checkout-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: compose
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # health_check extension
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
